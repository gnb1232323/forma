<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Форма</title>
  <meta name="description" content="Трекер тренировок и питания с распознаванием по фото">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f6f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Форма">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hdr" class="hdr"></header>
    <main id="main" class="main"></main>
  </div>

  <nav id="tabs" class="tabs">
    <button data-tab="workouts" class="on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Тренировки</span></button>
    <button data-tab="food"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 5-3.5 8h3.5"/></svg><span>Еда</span></button>
  </nav>

  <div id="sheetRoot"></div>
  <div id="toast" class="toast" role="status"></div>

  <input type="file" id="in-w-cam" accept="image/*" capture="environment" hidden>
  <input type="file" id="in-w-gal" accept="image/*" hidden>
  <input type="file" id="in-f-cam" accept="image/*" capture="environment" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
